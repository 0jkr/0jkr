<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">0JKR — signal lost, presence detected</title>
  <desc id="desc">A dark violet terminal with a distorted eye and a blinking cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08060d"/>
      <stop offset="0.55" stop-color="#100b19"/>
      <stop offset="1" stop-color="#1c0b24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d946ef" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d946ef" stop-opacity=".8"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="55%">
      <stop stop-color="#f0abfc"/>
      <stop offset=".2" stop-color="#a855f7"/>
      <stop offset=".6" stop-color="#45135b"/>
      <stop offset="1" stop-color="#09060d"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c084fc" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <clipPath id="eyeClip">
      <path d="M660 164 Q775 67 890 164 Q775 263 660 164Z"/>
    </clipPath>
  </defs>

  <rect width="1000" height="330" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="330" rx="18" fill="url(#grid)"/>
  <path d="M1 1H999V329H1Z" fill="none" stroke="#a855f7" stroke-opacity=".36" stroke-width="2"/>

  <g opacity=".23" fill="#d946ef">
    <rect x="0" y="51" width="1000" height="1"/>
    <rect x="0" y="276" width="1000" height="1"/>
  </g>
  <rect x="52" y="42" width="355" height="2" fill="url(#glow)"/>
  <text x="58" y="75" fill="#c084fc" font-family="monospace" font-size="13" letter-spacing="3">CONNECTION: LOST</text>

  <text x="52" y="177" fill="#f5efff" font-family="monospace" font-size="88" font-weight="700" letter-spacing="-7">0JKR</text>
  <text x="58" y="212" fill="#b8a9c9" font-family="monospace" font-size="15" letter-spacing="2">SIGNAL LOST <tspan fill="#a855f7">//</tspan> PRESENCE DETECTED</text>

  <g font-family="monospace" font-size="12" letter-spacing="1.4">
    <text x="59" y="260" fill="#766b82">PROCESS</text>
    <text x="142" y="260" fill="#e879f9">STILL RUNNING</text>
    <rect x="265" y="248" width="8" height="15" fill="#d946ef" opacity=".9"/>
  </g>

  <g clip-path="url(#eyeClip)">
    <rect x="650" y="66" width="250" height="200" fill="#100b19"/>
    <path d="M660 164 Q775 67 890 164 Q775 263 660 164Z" fill="#180c22" stroke="#c084fc" stroke-width="2"/>
    <circle cx="775" cy="164" r="76" fill="url(#iris)"/>
    <ellipse cx="775" cy="164" rx="16" ry="62" fill="#050308"/>
    <circle cx="749" cy="137" r="9" fill="#fff" opacity=".7"/>
    <path d="M655 128H893M650 149H900M650 181H900M660 201H891" stroke="#d946ef" stroke-opacity=".24" stroke-width="2"/>
    <path d="M670 98L888 224M696 78L860 244" stroke="#8b5cf6" stroke-opacity=".16" stroke-width="1"/>
  </g>
  <path d="M660 164 Q775 67 890 164 Q775 263 660 164Z" fill="none" stroke="#d946ef" stroke-opacity=".75" stroke-width="2"/>
  <path d="M650 163H905" stroke="#d946ef" stroke-opacity=".2" stroke-width="1" stroke-dasharray="4 8"/>

  <g fill="#e879f9" opacity=".72">
    <rect x="914" y="102" width="24" height="2"/>
    <rect x="928" y="111" width="13" height="2" opacity=".55"/>
    <rect x="909" y="221" width="31" height="2" opacity=".48"/>
  </g>
  <text x="58" y="304" fill="#655a70" font-family="monospace" font-size="10" letter-spacing="2">DO NOT REFRESH</text>
  <text x="834" y="304" fill="#655a70" font-family="monospace" font-size="10" letter-spacing="2">REC 00:00:01</text>
</svg>
