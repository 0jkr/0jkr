<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09070d">
  <meta name="description" content="A quiet room with one eye on the cursor.">
  <title>0JKR // observation room</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e9e1ec;
      --muted: #827887;
      --violet: #bd83df;
      --line: #2c2232;
      --room: #09070d;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 43%, #21152a 0, #100c15 34%, var(--room) 75%),
        var(--room);
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .17;
      background: repeating-linear-gradient(0deg, transparent 0 3px, #000 4px 5px);
      mix-blend-mode: multiply;
    }
    main {
      width: min(900px, 100% - 40px);
      position: relative;
      padding: clamp(24px, 5vw, 54px);
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgb(19 14 24 / .94), rgb(10 8 13 / .94));
      box-shadow: 0 25px 100px #000b, 0 0 80px #8b5cf61a;
    }
    header, footer { display: flex; justify-content: space-between; gap: 20px; }
    header { color: var(--muted); font-size: 11px; letter-spacing: .13em; text-transform: uppercase; }
    header b { color: var(--violet); font-weight: 500; }
    .scene { min-height: 340px; display: grid; place-items: center; padding: 28px 0 18px; }
    .socket {
      width: min(470px, 82vw);
      aspect-ratio: 1.85;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 52% / 50%;
      background: radial-gradient(ellipse, #24182d 0 47%, #0d0911 76%);
      box-shadow: 0 0 55px #b15ddb22, inset 0 0 42px #000;
    }
    .sclera {
      width: 92%;
      height: 86%;
      position: relative;
      overflow: hidden;
      border-radius: 50% / 48%;
      background:
        radial-gradient(ellipse at 50% 48%, #ded6d5 0, #aaa0a6 58%, #736776 100%);
      box-shadow: inset 0 0 24px #1a101e88, 0 0 16px #c084fc28;
      transition: filter .25s ease;
    }
    .veins, .iris, .pupil, .glint, .lid { position: absolute; }
    .veins {
      inset: 0;
      opacity: .37;
      background:
        linear-gradient(22deg, transparent 48%, #8a465f 49%, transparent 50%) 5% 52% / 28% 32% no-repeat,
        linear-gradient(-16deg, transparent 47%, #a04c65 49%, transparent 51%) 96% 43% / 27% 38% no-repeat,
        linear-gradient(8deg, transparent 47%, #93506d 49%, transparent 51%) 4% 60% / 23% 22% no-repeat,
        linear-gradient(-26deg, transparent 47%, #a04c65 49%, transparent 51%) 95% 57% / 25% 27% no-repeat;
    }
    .iris {
      width: 38%;
      height: auto;
      max-height: 84%;
      aspect-ratio: 1;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      transform: translate(calc(-50% + var(--look-x, 0px)), calc(-50% + var(--look-y, 0px)));
      background:
        repeating-conic-gradient(from 6deg, #d5a9dc 0deg 1deg, #5a386c 2deg 5deg, #271d35 6deg 8deg),
        radial-gradient(circle, #b47fca 0 18%, #42274f 63%, #17121c 70%);
      background-blend-mode: screen, normal;
      box-shadow: 0 0 0 5px #17121caa, 0 0 22px #bb72d766, inset 0 0 18px #08060c;
      transition: transform 90ms ease-out;
      will-change: transform;
    }
    .iris::before {
      content: "";
      position: absolute;
      inset: 17%;
      border-radius: 50%;
      border: 1px solid #e1b8e366;
      box-shadow: 0 0 14px #d599e566;
    }
    .pupil {
      width: 31%;
      height: 78%;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at 43% 36%, #100b14, #030205 72%);
      box-shadow: 0 0 8px #08050b;
    }
    .glint {
      z-index: 2;
      top: 22%;
      left: 38%;
      width: 9%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #f7edf9;
      opacity: .84;
      filter: blur(1px);
      box-shadow: 0 0 12px #fff8;
    }
    .glint.small { top: 67%; left: 59%; width: 3%; opacity: .58; }
    .lid {
      z-index: 3;
      left: -2%;
      width: 104%;
      height: 52%;
      background: linear-gradient(180deg, #21152a, #120d18 82%, #3b2345);
      box-shadow: 0 5px 14px #0009;
      transform: scaleY(0);
      will-change: transform;
    }
    .lid.top { top: 0; transform-origin: top; border-radius: 0 0 50% 50%; }
    .lid.bottom { bottom: 0; transform-origin: bottom; border-radius: 50% 50% 0 0; background: linear-gradient(0deg, #21152a, #120d18 82%, #3b2345); }
    .socket.blink .lid { animation: blink 170ms cubic-bezier(.4, 0, .8, .2) both; }
    .socket.blink .lid.bottom { animation-name: blink-bottom; }
    .socket.blink .sclera { filter: brightness(.6); }
    @keyframes blink { 0%, 100% { transform: scaleY(0); } 45%, 70% { transform: scaleY(1); } }
    @keyframes blink-bottom { 0%, 100% { transform: scaleY(0); } 45%, 70% { transform: scaleY(1); } }
    .caption { margin: 18px 0 0; text-align: center; color: #b7aaba; font: italic 16px/1.5 Georgia, serif; letter-spacing: .02em; }
    footer { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line); color: #716678; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    footer span:last-child { color: var(--violet); }
    @media (max-width: 560px) {
      main { width: 100%; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; padding: 24px; border: 0; }
      .scene { min-height: 260px; }
      footer { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .socket.blink .lid { animation-duration: .01ms; }
    }
  </style>
</head>
<body>
  <main>
    <header><span>0JKR <b>//</b> OBSERVATION ROOM</span><span id="state">SUBJECT: PRESENT</span></header>
    <section class="scene" aria-label="An eye that follows the pointer and blinks">
      <div class="socket" id="eye">
        <div class="sclera">
          <div class="veins"></div>
          <div class="iris" id="iris"><div class="pupil"></div></div>
          <div class="glint"></div><div class="glint small"></div>
        </div>
        <div class="lid top"></div><div class="lid bottom"></div>
      </div>
    </section>
    <p class="caption" id="caption">I noticed when you stopped moving.</p>
    <footer><span>GAZE: <b id="gaze">TRACKING</b></span><span>BLINK: <b id="blink-time">--</b></span><span>NO RECORDING</span></footer>
  </main>
  <script>
    (() => {
      const eye = document.getElementById('eye');
      const iris = document.getElementById('iris');
      const blinkTime = document.getElementById('blink-time');
      const state = document.getElementById('state');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let blinkTimer;

      function pointAt(x, y) {
        const rect = eye.getBoundingClientRect();
        const lookX = Math.max(-30, Math.min(30, (x - (rect.left + rect.width / 2)) / (rect.width / 2) * 30));
        const lookY = Math.max(-15, Math.min(15, (y - (rect.top + rect.height / 2)) / (rect.height / 2) * 15));
        iris.style.setProperty('--look-x', `${lookX}px`);
        iris.style.setProperty('--look-y', `${lookY}px`);
        state.textContent = 'SUBJECT: PRESENT';
      }
      document.addEventListener('pointermove', event => pointAt(event.clientX, event.clientY), { passive: true });
      document.addEventListener('pointerleave', () => {
        iris.style.setProperty('--look-x', '0px');
        iris.style.setProperty('--look-y', '0px');
        state.textContent = 'SUBJECT: ABSENT';
      });

      function blink() {
        eye.classList.remove('blink');
        void eye.offsetWidth;
        eye.classList.add('blink');
        blinkTime.textContent = `${(Math.random() * 2 + 3).toFixed(1)}S`;
        setTimeout(() => eye.classList.remove('blink'), 190);
        const next = reducedMotion ? 5000 : 2800 + Math.random() * 2600;
        blinkTimer = setTimeout(blink, next);
      }
      blinkTimer = setTimeout(blink, 1800);
      window.addEventListener('pagehide', () => clearTimeout(blinkTimer), { once: true });
    })();
  </script>
</body>
</html>
